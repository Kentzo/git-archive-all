[metadata]
name = git-archive-all
author = Ilya Kulakov
author_email = kulakov.ilya@gmail.com
url = https://github.com/Kentzo/git-archive-all
description = Archive git repository with its submodules.
license = MIT
license_expression = MIT
license_files = LICENSE.txt
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Console
    Intended Audience :: Developers
    Intended Audience :: System Administrators
    Natural Language :: English
    Operating System :: MacOS
    Operating System :: Microsoft :: Windows
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: Implementation :: CPython
    Programming Language :: Python :: Implementation :: PyPy
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15
    Topic :: Software Development :: Version Control
    Topic :: System :: Archiving
    Typing :: Typed
long_description = file: README.rst
long_description_content_type = text/x-rst

[options]
zip_safe = 1
python_requires = >=3.6

[tool:pytest]
testpaths = test_git_archive_all.py
addopts = --cov=git_archive_all --cov-report=term --cov-branch --showlocals -vv -ra --strict-markers
filterwarnings = error

[coverage:run]
relative_files = true

[tox:tox]
envlist =
    py36
    py37
    py38
    py39
    py310
    py311
    py312
    py313
    py314
    py315
    pypy3
skipsdist = true

[testenv]
deps = -rtest-requirements.txt
commands = pytest {posargs}
