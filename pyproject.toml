[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-archive-all"
dynamic = ["version"]
description = "Archive git repository with its submodules."
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{name = "Ilya Kulakov", email = "kulakov.ilya@gmail.com"}]
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Version Control",
    "Topic :: System :: Archiving",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Kentzo/git-archive-all"

[project.scripts]
git-archive-all = "git_archive_all:main"

[tool.setuptools]
py-modules = ["git_archive_all"]
packages = ["git_archive_all-stubs"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]

[tool.setuptools.dynamic]
version = {attr = "git_archive_all.__version__"}

[tool.pytest.ini_options]
testpaths = ["test_git_archive_all.py"]
addopts = "--cov=git_archive_all --cov-report=term --cov-branch --showlocals -vv -ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
relative_files = true

[tool.tox]
legacy_tox_ini = """
[tox]
envlist =
    py37
    py38
    py39
    py310
    py311
    py312
    py313
    py314
    py315
    pypy3
skipsdist = true

[testenv]
deps = -rtest-requirements.txt
commands = pytest {posargs}
"""
