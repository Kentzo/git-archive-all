[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-archive-all"
dynamic = ["version"]
description = "Archive git repository with its submodules."
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{name = "Ilya Kulakov", email = "kulakov.ilya@gmail.com"}]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Version Control",
    "Topic :: System :: Archiving",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Kentzo/git-archive-all"
Changelog = "https://github.com/Kentzo/git-archive-all/blob/master/CHANGES.rst"
Issues = "https://github.com/Kentzo/git-archive-all/issues"

[project.scripts]
git-archive-all = "git_archive_all:main"

[dependency-groups]
test = [
    "pycodestyle==2.12.1; python_version < '3.9'",
    "pycodestyle==2.14.0; python_version == '3.9'",
    "pycodestyle==2.15.0; python_version >= '3.10'",
    "pytest==8.3.5; python_version < '3.9'",
    "pytest==8.4.2; python_version == '3.9'",
    "pytest==9.2.0; python_version >= '3.10'",
    "pytest-cov==5.0.0; python_version < '3.9'",
    "pytest-cov==7.1.0; python_version >= '3.9'",
    "pytest-mock==3.14.1; python_version < '3.9'",
    "pytest-mock==3.15.1; python_version == '3.9'",
    "pytest-mock==3.17.0; python_version >= '3.10'",
    # coverage needs it to read pyproject.toml before Python 3.11.
    "tomli==2.0.1; python_version < '3.11'",
]
stubtest = ["mypy==2.4.1"]

[tool.setuptools]
py-modules = ["git_archive_all"]
packages = ["git_archive_all-stubs"]

[tool.setuptools.dynamic]
version = {attr = "git_archive_all.__version__"}

[tool.pytest.ini_options]
testpaths = ["test_git_archive_all.py"]
addopts = "--cov=git_archive_all --cov-report=term --cov-branch --showlocals -vv -ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
relative_files = true

[tool.tox]
requires = ["tox>=4.22"]  # dependency_groups
env_list = ["py38", "py39", "py310", "py311", "py312", "py313", "py314", "py315", "pypy3", "stubtest"]
no_package = true

[tool.tox.env_run_base]
dependency_groups = ["test"]
commands = [["pytest", { replace = "posargs", extend = true }]]

[tool.tox.env.stubtest]
dependency_groups = ["stubtest"]
set_env = { MYPYPATH = "{tox_root}" }
commands = [["python", "-m", "mypy.stubtest", "git_archive_all"]]
